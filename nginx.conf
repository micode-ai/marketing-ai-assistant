worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Rate limiting for API
    limit_req_zone $binary_remote_addr zone=marketing_api:10m rate=10r/s;

    # Use Docker DNS resolver
    resolver 127.0.0.11 valid=30s;

    # Redirect HTTP → HTTPS
    server {
        listen 80;
        server_name emarketingai.pl www.emarketingai.pl;
        return 301 https://emarketingai.pl$request_uri;
    }

    # Redirect www → apex
    server {
        listen 443 ssl;
        server_name www.emarketingai.pl;

        ssl_certificate     /etc/letsencrypt/live/emarketingai.pl/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/emarketingai.pl/privkey.pem;

        return 301 https://emarketingai.pl$request_uri;
    }

    # Main HTTPS server
    server {
        listen 443 ssl;
        server_name emarketingai.pl;

        ssl_certificate     /etc/letsencrypt/live/emarketingai.pl/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/emarketingai.pl/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        set $upstream_web http://web:3000;
        set $upstream_api http://api:3000;

        # API requests
        location /api/ {
            limit_req zone=marketing_api burst=20 nodelay;
            proxy_pass $upstream_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Web frontend (everything else)
        location / {
            proxy_pass $upstream_web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
