version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: marketing-ai-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-marketing_ai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: marketing-ai-redis-prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: marketing-ai-api
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
    depends_on:
      - postgres
      - redis
    networks:
      - internal
      - external
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.yourdomain.com`)"

  ai-agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.ai-agent
    container_name: marketing-ai-agent
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
    depends_on:
      - postgres
      - redis
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: marketing-ai-web
    restart: always
    env_file:
      - .env
    networks:
      - external
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`app.yourdomain.com`)"

volumes:
  postgres_data:
  redis_data:

networks:
  internal:
    internal: true
  external:
