services:
  postgres:
    image: postgres:16-alpine
    container_name: marketing-ai-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-marketing_ai}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - marketing-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketing_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: marketing-ai-redis-prod
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data_prod:/data
    networks:
      - marketing-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 192M

  migrator:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: migrator
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-marketing_ai}?schema=public"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - marketing-network
    profiles:
      - migrate

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: marketing-ai-api-prod
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-marketing_ai}?schema=public"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_URL: "redis://redis:6379"
      AI_AGENT_URL: "http://ai-agent:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - marketing-network
    deploy:
      resources:
        limits:
          memory: 512M

  ai-agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.ai-agent
    container_name: marketing-ai-agent-prod
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      AI_AGENT_PORT: "3001"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-marketing_ai}?schema=public"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - marketing-network
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: marketing-ai-web-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_URL: "http://api:3000/api"
      ORIGIN: "https://${WEB_DOMAIN:-localhost}"
    depends_on:
      - api
    networks:
      - marketing-network
    deploy:
      resources:
        limits:
          memory: 256M

  # NOTE: nginx is handled by the shared accounting-nginx container
  # which routes both eksiegowyai.pl and emarketingai.pl.
  # See /opt/accounting-ai-agent/nginx.conf on the VPS.

volumes:
  postgres_data_prod:
  redis_data_prod:

networks:
  marketing-network:
    driver: bridge
