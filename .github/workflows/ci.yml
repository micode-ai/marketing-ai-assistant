name: CI/CD Pipeline

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  # Manual trigger, because a merge that produces no run leaves development
  # deployed one commit behind with no way to re-run: a run that was never
  # created cannot be retried, and the only other option is an empty commit.
  # Happened on 2026-08-26 — the push for f9f7507 produced no run at all.
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this run was started by hand'
        required: false
        default: 'redeploy'

# Cancel superseded checks on the same ref — but only where nothing is
# deployed. Workflow-level cancellation kills the whole run including a
# running deploy job, so on `development` (the only branch that deploys)
# runs are left to finish and the deploy job below serializes them instead.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/development' }}

env:
  NODE_VERSION: '20'
  NODE_OPTIONS: '--max-old-space-size=4096'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run linter
        run: pnpm lint

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build all apps
        run: pnpm build

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      # No continue-on-error: with it the job reported success whatever the
      # tests did, and five campaigns tests failed unnoticed from #59 until
      # #173. A gate that cannot fail is not a gate.
      - name: Run tests
        run: pnpm test

  deploy:
    name: Deploy to Hetzner VPS
    runs-on: ubuntu-latest
    needs: build
    # workflow_dispatch counts: a manual run exists precisely to deploy what a
    # missing push run left behind. Without it the button would build and test
    # and then skip the only job worth pressing it for.
    if: github.ref == 'refs/heads/development' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: staging

    # One deploy at a time. Merging several PRs in a row used to start a deploy
    # per merge, all of them building Docker images on the same VPS at once:
    # they starved each other and every run died on the 10-minute SSH timeout.
    # cancel-in-progress stays false on purpose — killing the SSH session
    # mid-"docker compose up" can leave containers stopped, so queueing is the
    # safe behaviour even though it means the odd redundant deploy.
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 10m
          script: |
            cd /opt/marketing-ai
            bash scripts/deploy.sh

      - name: Verify deployment
        run: |
          sleep 10
          echo "Deployment triggered successfully"
